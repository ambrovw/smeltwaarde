AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Discord notifier for smeltwaarde.co.za: koop/verkoop contact form
  submissions and Deel/Verkoop click events. Public Lambda Function URL.

Resources:
  ContactFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smeltwaarde-contact-form
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          # Deel/Verkoop click pings — REPLACE before deploying (do not commit real URLs)
          DISCORD_WEBHOOK: REPLACE_WITH_CLICKS_WEBHOOK_URL
          # Contact form inquiries (navrae) — REPLACE before deploying
          DISCORD_WEBHOOK_NAVRAE: REPLACE_WITH_NAVRAE_WEBHOOK_URL
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - https://smeltwaarde.co.za
            - https://meltvalue.co.za
            - https://qa.smeltwaarde.co.za
            - http://localhost:5173
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 3600
Outputs:
  FunctionUrl:
    Description: Public endpoint for the contact form (paste into src/components/ContactForm.jsx)
    Value: !GetAtt ContactFormFunctionUrl.FunctionUrl
