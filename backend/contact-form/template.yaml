AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Discord notifier for smeltwaarde.co.za: koop/verkoop contact form
  submissions and Deel/Verkoop click events. Public Lambda Function URL.

Resources:
  ContactFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smeltwaarde-contact-form
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          # Webhook URLs live in SSM Parameter Store (eu-west-1), resolved at deploy time —
          # never commit the real URLs to this file.
          DISCORD_WEBHOOK: '{{resolve:ssm:/smeltwaarde/discord-webhook-clicks}}'
          DISCORD_WEBHOOK_NAVRAE: '{{resolve:ssm:/smeltwaarde/discord-webhook-navrae}}'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - https://smeltwaarde.co.za
            - https://meltvalue.co.za
            - https://qa.smeltwaarde.co.za
            - http://localhost:5173
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 3600
Outputs:
  FunctionUrl:
    Description: Public endpoint for the contact form (paste into src/components/ContactForm.jsx)
    Value: !GetAtt ContactFormFunctionUrl.FunctionUrl
