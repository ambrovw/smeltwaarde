AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Discord notifier for smeltwaarde.co.za: koop/verkoop contact form
  submissions and Deel/Verkoop click events. Public Lambda Function URL.

Resources:
  ContactFormFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smeltwaarde-contact-form
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs20.x
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          # Deel/Verkoop click pings
          DISCORD_WEBHOOK: https://discord.com/api/webhooks/1536734234369069167/vbbvFEOcGPdzNfnwnJbjrP2NU1zy_CEKXSe-4nR9qXiOBsqq7oVMEz6efD93_fDVOlWD
          # Contact form inquiries (navrae)
          DISCORD_WEBHOOK_NAVRAE: https://discord.com/api/webhooks/1536759203631468544/yS5W0eCLb_xzVvK4BhjjG1TAdFJJeUd2QbDBOoGBqG6yyaY2ivdCRFGfQaYltQC3U2Rz
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - https://smeltwaarde.co.za
            - https://meltvalue.co.za
            - https://qa.smeltwaarde.co.za
            - http://localhost:5173
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type
          MaxAge: 3600
Outputs:
  FunctionUrl:
    Description: Public endpoint for the contact form (paste into src/components/ContactForm.jsx)
    Value: !GetAtt ContactFormFunctionUrl.FunctionUrl
