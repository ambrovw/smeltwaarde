<head>

    <!-- Hreflang -->
    <link rel="alternate" hreflang="af" href="https://smeltwaarde.co.za/" />
    <link rel="alternate" hreflang="en" href="https://meltvalue.co.za/" />
    <link rel="alternate" hreflang="x-default" href="https://smeltwaarde.co.za/" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smeltwaarde" />
    <meta name="twitter:description" content="Bereken die smeltwaarde van Suid-Afrikaanse silwer en goue munte." />
    <meta name="twitter:image" content="/smeltwaarde_logo_transparent_bgfill.png" />
    <meta name="description" content="Bereken die smeltwaarde van Suid-Afrikaanse silwer en goue munte." />
    <title>Smeltwaarde</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BWGJV426YF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-BWGJV426YF');
    </script>
    <!-- Dynamic meta/OG/structured data based on domain -->
    <script>
        (function(){
            var isEn = location.hostname === 'meltvalue.co.za';
            var title = isEn ? 'Melt Value' : 'Smeltwaarde';
            var desc = isEn
                ? 'Calculate the melt value of South African silver and gold coins.'
                : 'Bereken die smeltwaarde van Suid-Afrikaanse silwer en goue munte.';
            document.documentElement.lang = isEn ? 'en' : 'af';
            document.title = title;
            function setMeta(attr, key, value) {
                var el = document.querySelector('meta[' + attr + '="' + key + '"]');
                if (el) el.content = value;
            }
            setMeta('property', 'og:title', title);
            setMeta('property', 'og:description', desc);
            setMeta('property', 'og:url', location.origin + '/');
            setMeta('name', 'twitter:title', title);
            setMeta('name', 'twitter:description', desc);
            setMeta('name', 'description', desc);
            // Structured data
            var ld = document.querySelector('script[type="application/ld+json"]');
            if (ld) {
                var data = JSON.parse(ld.textContent);
                data.name = title;
                data.url = location.origin;
                data.description = desc;
                ld.textContent = JSON.stringify(data);
            }
        })();
    </script>
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Smeltwaarde",
        "url": "https://smeltwaarde.co.za",
        "description": "Bereken die smeltwaarde van Suid-Afrikaanse silwer en goue munte.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "ZAR"
        },
        "inLanguage": ["af", "en"],
        "sameAs": ["https://smeltwaarde.co.za", "https://meltvalue.co.za"]
    }
    </script>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>

</body>
</html>
